[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-intel"
version = "0.1.0"
description = "AI-powered Business Workflow Analyzer, Automation Architect, and Agentic Systems Design Platform"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Workflow Intel" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Optional LLM layer — agents upgrade to claude-opus-4-8 with structured outputs.
llm = ["anthropic>=0.40"]
# Optional true LangGraph StateGraph execution.
graph = ["langgraph>=0.2"]
# Optional OpenTelemetry export (the in-memory recorder works without these).
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
]
# Optional PostgreSQL persistence.
postgres = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
workflow-intel = "workflow_intel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["workflow_intel*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `ruff format` owns line layout; E501 only flags unsplittable long string literals.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
